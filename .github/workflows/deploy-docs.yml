name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main, next]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: ${{ github.ref_name == 'next' && '/srv/robo-docs-next' || '/srv/robo-docs' }}
      SERVICE_NAME: ${{ github.ref_name == 'next' && 'robo-docs-next' || 'robo-docs' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.11

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        working-directory: docs
        run: pnpm run build

      - name: Package build
        working-directory: docs
        run: |
          cp -r public .next/standalone/docs/public
          cp -r .next/static .next/standalone/docs/.next/static
          tar czf /tmp/robo-docs.tar.gz -C .next/standalone .

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
          HOST: ${{ secrets.DOCS_HOST }}
          USER: ${{ secrets.DOCS_USER }}
        run: |
          cleanup() { rm -f ~/.ssh/deploy_key; }
          trap cleanup EXIT
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key /tmp/robo-docs.tar.gz "$USER@$HOST:/tmp/"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "mkdir -p ${DEPLOY_DIR}-new && tar xzf /tmp/robo-docs.tar.gz -C ${DEPLOY_DIR}-new && rm -rf ${DEPLOY_DIR}-old && mv ${DEPLOY_DIR} ${DEPLOY_DIR}-old 2>/dev/null; mv ${DEPLOY_DIR}-new ${DEPLOY_DIR} && systemctl restart ${SERVICE_NAME} && sleep 2 && curl -sf http://localhost:\$(grep -oP 'PORT=\K[0-9]+' /etc/systemd/system/${SERVICE_NAME}.service) > /dev/null && rm -rf ${DEPLOY_DIR}-old && rm /tmp/robo-docs.tar.gz"
